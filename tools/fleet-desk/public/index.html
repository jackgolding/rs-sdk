<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet desk</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12110e;
    --surface: #1a1814;
    --surface-2: #211e19;
    --surface-3: #2a2620;
    --line: #34302a;
    --line-strong: #4a4338;
    --text: #f3ecdf;
    --muted: #a89b8a;
    --faint: #6f685e;
    --brass: #e2a85a;
    --brass-ink: #f0d7a8;
    --brass-bg: rgba(226, 168, 90, 0.14);
    --good: #8fce7a;
    --good-bg: rgba(143, 206, 122, 0.13);
    --bad: #ec8a6f;
    --bad-bg: rgba(236, 138, 111, 0.13);
    --warn: #e6c36a;
    --warn-bg: rgba(230, 195, 106, 0.13);
    --paused: #9a9286;
    --paused-bg: rgba(154, 146, 134, 0.14);
    --swarm: #7fb3e6;
    --swarm-bg: rgba(127, 179, 230, 0.14);
    --focus: #f0d7a8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 18px rgba(0, 0, 0, 0.18);
    --pop-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --head-bg: rgba(18, 17, 14, 0.92);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f1ec;
    --surface: #ffffff;
    --surface-2: #f8f6f2;
    --surface-3: #eee9e1;
    --line: #e2dbd0;
    --line-strong: #cbbfae;
    --text: #231e17;
    --muted: #6c6152;
    --faint: #a59a8b;
    --brass: #a5661c;
    --brass-ink: #7b4a10;
    --brass-bg: rgba(165, 102, 28, 0.1);
    --good: #2e7d32;
    --good-bg: rgba(46, 125, 50, 0.1);
    --bad: #c0442a;
    --bad-bg: rgba(192, 68, 42, 0.09);
    --warn: #946400;
    --warn-bg: rgba(178, 124, 0, 0.12);
    --paused: #786f63;
    --paused-bg: rgba(120, 111, 99, 0.1);
    --swarm: #2a67a6;
    --swarm-bg: rgba(42, 103, 166, 0.09);
    --focus: #7b4a10;
    --shadow: 0 1px 2px rgba(60, 45, 20, 0.08), 0 4px 14px rgba(60, 45, 20, 0.06);
    --pop-shadow: 0 10px 30px rgba(60, 45, 20, 0.18);
    --head-bg: rgba(244, 241, 236, 0.92);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f1ec;
      --surface: #ffffff;
      --surface-2: #f8f6f2;
      --surface-3: #eee9e1;
      --line: #e2dbd0;
      --line-strong: #cbbfae;
      --text: #231e17;
      --muted: #6c6152;
      --faint: #a59a8b;
      --brass: #a5661c;
      --brass-ink: #7b4a10;
      --brass-bg: rgba(165, 102, 28, 0.1);
      --good: #2e7d32;
      --good-bg: rgba(46, 125, 50, 0.1);
      --bad: #c0442a;
      --bad-bg: rgba(192, 68, 42, 0.09);
      --warn: #946400;
      --warn-bg: rgba(178, 124, 0, 0.12);
      --paused: #786f63;
      --paused-bg: rgba(120, 111, 99, 0.1);
      --swarm: #2a67a6;
      --swarm-bg: rgba(42, 103, 166, 0.09);
      --focus: #7b4a10;
      --shadow: 0 1px 2px rgba(60, 45, 20, 0.08), 0 4px 14px rgba(60, 45, 20, 0.06);
      --pop-shadow: 0 10px 30px rgba(60, 45, 20, 0.18);
      --head-bg: rgba(244, 241, 236, 0.92);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 13px/1.4 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }
  button:hover { border-color: var(--brass); }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  button:disabled { opacity: 0.45; cursor: default; }
  #refresh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 96px;
  }
  #refresh .spin {
    display: none;
    width: 12px;
    height: 12px;
    border: 2px solid var(--line-strong);
    border-top-color: var(--brass);
    border-radius: 50%;
    animation: refresh-spin 0.7s linear infinite;
    flex: none;
  }
  #refresh.busy,
  #refresh:disabled.busy {
    opacity: 1;
    background: var(--surface-3);
    color: var(--muted);
    border-color: var(--line);
    cursor: progress;
    pointer-events: none;
  }
  #refresh.busy .spin { display: inline-block; }
  @keyframes refresh-spin { to { transform: rotate(360deg); } }
  button.primary { background: var(--brass-bg); border-color: var(--brass); color: var(--brass-ink); font-weight: 600; }
  button.danger:hover { border-color: var(--bad); }
  select, input[type="search"], input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
  }
  header.top {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 10px 16px;
    background: var(--head-bg);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
  .headline { color: var(--brass); font-weight: 650; }
  .headline.bad { color: var(--bad); }
  .muted { color: var(--muted); }
  #sub { font-size: 12px; }
  #box { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  #box[hidden] { display: none; }
  #box .warn { color: var(--warn); }
  #box .bad { color: var(--bad); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  .tabs { display: flex; gap: 2px; padding: 2px; background: var(--surface-3); border-radius: 8px; }
  .tabs button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  #theme { min-width: 64px; }
  main { padding: 0 0 80px; }

  /* Summary tiles */
  #summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    padding: 14px 16px 4px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  button.tile { cursor: pointer; font: inherit; }
  button.tile:hover { border-color: var(--line-strong); }
  button.tile[aria-pressed="true"] { border-color: var(--brass); }
  .tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .tile .v { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .tile .c { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.good .v { color: var(--good); }
  .tile.bad .v { color: var(--bad); }
  .tile.swarm .v { color: var(--swarm); }
  .tile.paused .v { color: var(--paused); }
  .tile.qptile .v { color: var(--brass); }

  /* Fleet sections and cards */
  #fleet { padding: 6px 16px 0; }
  #fleet[hidden] { display: none; }
  .section { margin-top: 14px; }
  .section > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 2px 8px;
    user-select: none;
  }
  .section > summary::-webkit-details-marker { display: none; }
  .section > summary::before { content: "▾"; color: var(--faint); font-size: 11px; width: 10px; }
  .section:not([open]) > summary::before { content: "▸"; }
  .section h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .section .count { color: var(--muted); font-weight: 600; }
  .section .hint { color: var(--faint); font-size: 12px; }
  .section.bad h2 { color: var(--bad); }
  .section.good h2 { color: var(--good); }
  .section.swarm h2 { color: var(--swarm); }
  .section.paused h2 { color: var(--paused); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  .card {
    --kind: var(--bad);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 10px 12px 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    position: relative;
    min-width: 0;
    overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kind); }
  .card.producing { --kind: var(--good); }
  .card.swarm { --kind: var(--swarm); }
  .card.paused { --kind: var(--paused); }
  .card.warn { --kind: var(--warn); }
  .card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-head .name-btn { font-size: 15px; font-weight: 700; }
  .tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface-3);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .qp {
    margin-left: auto;
    flex: none;
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    background: var(--brass-bg);
    color: var(--brass-ink);
    border-radius: 999px;
    padding: 1px 9px;
    font-weight: 700;
    font-size: 13px;
  }
  .qp small { font-size: 10px; font-weight: 650; letter-spacing: 0.04em; opacity: 0.8; }
  .qp.none { background: var(--surface-3); color: var(--faint); }
  .cb { flex: none; color: var(--muted); font-size: 12px; }
  .cb b { color: var(--text); }
  .status { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; }
  .status .reason { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pill {
    display: inline-block;
    flex: none;
    border-radius: 999px;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 650;
    line-height: 18px;
    color: var(--bad);
    background: var(--bad-bg);
  }
  .pill.producing { color: var(--good); background: var(--good-bg); }
  .pill.paused { color: var(--paused); background: var(--paused-bg); }
  .pill.swarm { color: var(--swarm); background: var(--swarm-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .now { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .now .job { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .job .kind-label { color: var(--muted); font-weight: 600; }
  .now .phase { font-family: var(--mono); font-size: 11px; color: var(--brass-ink); background: var(--brass-bg); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 500; }
  .now .line { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .line.hot { color: var(--warn); }
  .health { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .metric { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; min-width: 0; }
  .metric span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .metric b { display: block; font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metric.good b { color: var(--good); }
  .metric.warn b { color: var(--warn); }
  .metric.bad b { color: var(--bad); }
  .metric.dim b { color: var(--faint); }
  .meta { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); min-width: 0; }
  .meta .rate { color: var(--text); font-weight: 600; }
  .pos a { color: var(--brass-ink); text-decoration: none; font-weight: 600; }
  .pos a:hover { text-decoration: underline; }
  .pos.stale, .pos.stale a { color: var(--warn); }
  .card-foot { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-top: 7px; margin-top: 1px; flex-wrap: wrap; }
  .job-edit { flex: 1 1 100%; order: 2; min-width: 0; }
  .job-edit > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: flex; gap: 6px; align-items: baseline; min-width: 0; white-space: nowrap; }
  .job-edit > summary::-webkit-details-marker { display: none; }
  .job-edit > summary::before { content: "▸"; font-size: 10px; flex: none; }
  .job-edit[open] > summary::before { content: "▾"; }
  .job-edit > summary code { font-family: var(--mono); font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
  .job-edit[open] > summary code { white-space: normal; word-break: break-all; }
  .job-edit[open] .script-cell { margin-top: 6px; }
  .script-cell { display: flex; gap: 4px; align-items: center; }
  .script-cell select { flex: 1; min-width: 0; }
  .script-cell input { width: 110px; padding: 2px 6px; }
  .script-cell button { padding: 2px 8px; font-size: 12px; }
  #gateway-banner {
    padding: 8px 16px;
    background: var(--bad-bg);
    border-bottom: 1px solid var(--bad);
    color: var(--bad);
    font-weight: 600;
  }
  #gateway-banner[hidden] { display: none; }
  .badge {
    display: inline-block;
    border-radius: 999px;
    padding: 0 6px;
    border: 1px solid var(--line);
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .badge.hub { color: var(--warn); border-color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--bad); }
  .dot.producing { background: var(--good); }
  .dot.paused { background: var(--paused); }
  .dot.swarm { background: var(--swarm); }
  .dot.warn { background: var(--warn); }
  .actions { display: flex; flex-wrap: nowrap; gap: 3px; order: 1; }
  .actions button.icon {
    width: 28px;
    height: 26px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
  }
  .actions button.icon svg { width: 15px; height: 15px; display: block; }
  .actions button.icon .emoji { font-size: 14px; line-height: 1; }
  .actions .sep { width: 1px; background: var(--line); margin: 3px 3px; }
  .skills { display: flex; gap: 2px; align-items: center; cursor: pointer; flex-wrap: wrap; }
  .skill { display: inline-flex; align-items: center; gap: 2px; padding: 1px 3px; border-radius: 4px; background: var(--surface-2); }
  .skill.hot { outline: 1px solid var(--brass); background: var(--brass-bg); }
  .skill.extra { margin-left: 4px; }
  .skill b { font-size: 11px; font-weight: 650; min-width: 1.15em; }
  .skill.max b { color: var(--brass-ink); }
  .si {
    width: 16px; height: 16px; display: block; flex: none;
    background: url(/icons/skills.png) no-repeat;
    background-size: 96px 48px;
    image-rendering: pixelated;
  }
  .si.rc { background-image: url(/icons/runecraft.png); background-size: 16px 16px; background-position: 0 0; }
  #skill-pop {
    position: fixed; z-index: 30; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px;
    box-shadow: var(--pop-shadow);
  }
  #skill-pop[hidden] { display: none; }
  .pop-skill { display: flex; align-items: center; gap: 6px; }
  .pop-skill span { flex: 1; color: var(--muted); }
  #skill-pop h3 { grid-column: 1 / -1; margin: 0 0 4px; font-size: 13px; font-weight: 650; }
  #skill-pop .pop-foot { grid-column: 1 / -1; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .lvl99 { font-weight: 700; color: var(--brass-ink); }
  .lvl1 { color: var(--faint); }
  .num { text-align: right; }
  .empty { color: var(--muted); padding: 24px 2px; }

  /* Stats and quests tables */
  .table-wrap { overflow: auto; max-height: calc(100vh - 210px); margin: 12px 16px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .table-wrap[hidden] { display: none; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: 4px 7px; border-bottom: 1px solid var(--line); vertical-align: middle; text-align: left; white-space: nowrap; }
  th {
    position: sticky;
    top: 0;
    background: var(--surface-3);
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    z-index: 2;
  }
  tbody tr:hover td { background: var(--surface-2); }
  tbody tr:hover td.account { background: var(--surface-2); }
  td.account { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  th.account { left: 0; z-index: 3; }
  tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
  td.qpcell { font-weight: 700; color: var(--brass-ink); }
  #quest-goal { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; left: 0; }
  #quest-goal b { color: var(--brass-ink); font-size: 15px; }
  #quest-goal .bad b { color: var(--bad); }
  #quest-goal .spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; vertical-align: middle; }
  #quest-goal .spark i { display: block; width: 6px; background: var(--brass); border-radius: 1px 1px 0 0; }
  #quest-goal .note { margin: 0; flex-basis: 100%; font-size: 12px; }
  #quests th.q { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 500; padding: 6px 2px; text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--text); }
  #quests th.q small { color: var(--muted); }
  #quests th.q.mini { font-style: italic; color: var(--muted); }
  #quests th.q.free { color: var(--brass-ink); }
  #quests td.qc { text-align: center; padding: 3px 2px; min-width: 22px; }
  #quests th.qp-head, #quests td.qpcell { text-align: right; }
  .qc.done { color: var(--good); }
  .qc.running { color: var(--brass-ink); font-weight: 700; }
  .qc.queued { color: var(--faint); }
  .qc.retrying { color: var(--warn); }
  .qc.failed { color: var(--bad); font-weight: 700; }
  .qc.stock { color: var(--paused); }
  .legend { display: inline-flex; gap: 10px; font-size: 12px; color: var(--muted); }
  #toast {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: min(420px, calc(100vw - 32px));
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: var(--pop-shadow);
  }
  .toast pre {
    margin: 6px 0 0;
    max-height: 140px;
    overflow: auto;
    white-space: pre-wrap;
    color: var(--muted);
    font: 11px/1.35 var(--mono);
  }
  #panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: min(480px, 100vw);
    background: var(--surface);
    border-left: 1px solid var(--line);
    box-shadow: var(--pop-shadow);
    z-index: 15;
    display: flex;
    flex-direction: column;
  }
  #panel[hidden] { display: none; }
  #panel header, .panel-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  #panel h2 { margin: 0; font-size: 16px; flex: 1; }
  #panel-body { overflow: auto; padding: 12px 14px 28px; flex: 1; }
  #panel-body pre {
    margin: 0;
    white-space: pre;
    font: 12px/1.35 var(--mono);
  }
  .bank-table { width: 100%; }
  .bank-table td:last-child, .bank-table th:last-child { text-align: right; }
  .bank-table td.icon-cell, .bank-table th:first-child { width: 30px; }
  .item-icon {
    width: 24px; height: 24px; display: block;
    image-rendering: pixelated; object-fit: contain;
  }
  .item-icon.none { width: 24px; height: 24px; }
  .note { color: var(--muted); margin: 0 0 10px; }
  .who { margin: 0 0 6px; white-space: normal; }
  .scene-line { padding: 3px 0; border-bottom: 1px solid var(--line); white-space: normal; }
  .minimap { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
  .scene-line span { color: var(--muted); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: start; }
  .block h3 { margin: 8px 0 4px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .live-skills { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 0 8px; }
  details.raw { margin-top: 12px; }
  details.raw summary { cursor: pointer; color: var(--muted); }
  details.raw pre { margin-top: 8px; white-space: pre-wrap; }
  .name-btn {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-weight: 650;
    color: inherit;
    cursor: pointer;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name-btn:hover { color: var(--brass-ink); }
  #map-modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #000;
  }
  #map-modal[hidden] { display: none; }
  #map-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #map-card {
    position: absolute;
    top: 12px;
    left: 12px;
    width: min(400px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    z-index: 1;
  }
  #map-card header {
    position: sticky;
    top: 0;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  #map-search { position: relative; flex: 1; min-width: 0; }
  #map-account { width: 100%; font-weight: 650; color: inherit; }
  #map-hits {
    position: absolute;
    z-index: 2;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 240px;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  #map-hits[hidden] { display: none; }
  #map-hits button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 0;
  }
  #map-hits button.on, #map-hits button:hover { background: var(--surface-3); }
  #map-hits .note { margin: 6px 8px; }
  #map-card header a { color: var(--brass-ink); }
  #map-body { padding: 10px 12px 16px; }
  @media (max-width: 640px) {
    header.top { padding: 8px 12px; position: static; }
    .tools { margin-left: 0; }
    #summary, #fleet { padding-left: 12px; padding-right: 12px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .table-wrap { margin: 12px 12px 0; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Fleet desk</h1>
  <div>
    <div id="headline" class="headline">Loading…</div>
    <div id="sub" class="muted"></div>
    <div id="box" hidden title="VPS host health"></div>
  </div>
  <div class="tools">
    <div class="tabs">
      <button type="button" id="tab-fleet" aria-pressed="true">Fleet</button>
      <button type="button" id="tab-stats" aria-pressed="false">Stats</button>
      <button type="button" id="tab-quests" aria-pressed="false">Quests</button>
    </div>
    <input id="q" type="search" placeholder="Search accounts" />
    <select id="view"></select>
    <select id="kind">
      <option value="all">All kinds</option>
      <option value="not">Not producing</option>
      <option value="producing">Producing</option>
      <option value="paused">Paused</option>
      <option value="swarm">In swarm</option>
    </select>
    <button type="button" id="banks" title="Stop running grinds, log in accounts with no live client, open every roster bank, then start the grinds again. skip-bots are not force-logged in.">Check banks</button>
    <button type="button" id="refresh" aria-busy="false">
      <span class="spin" aria-hidden="true"></span>
      <span class="lbl">Refresh</span>
    </button>
    <button type="button" id="theme" title="Colour theme: follow the system, light or dark">Auto</button>
  </div>
</header>
<div id="gateway-banner" hidden></div>
<main>
  <section id="summary" aria-label="Fleet summary"></section>
  <div id="fleet"></div>
  <div class="table-wrap" id="stats-wrap" hidden>
    <table id="stats">
      <thead><tr id="stats-head"></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="table-wrap" id="quests-wrap" hidden>
    <div id="quest-goal" class="muted">Loading quests…</div>
    <table id="quests">
      <thead><tr id="quests-head"></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<div id="toast"></div>
<div id="skill-pop" hidden></div>
<div id="map-modal" hidden>
  <iframe id="map-frame" title="World map" allow="cross-origin-isolated" credentialless></iframe>
  <aside id="map-card">
    <header>
      <div id="map-search">
        <input id="map-account" type="search" placeholder="Account" aria-label="Account" autocomplete="off" spellcheck="false" />
        <div id="map-hits" hidden></div>
      </div>
      <a id="map-tab" target="_blank" rel="noopener">Tab</a>
      <button type="button" id="map-refresh">Refresh</button>
      <button type="button" id="map-close">Close</button>
    </header>
    <div id="map-body"></div>
  </aside>
</div>
<aside id="panel" hidden>
  <header>
    <h2 id="panel-title"></h2>
    <button type="button" id="panel-close">Close</button>
  </header>
  <div class="panel-tools" id="panel-tools"></div>
  <div id="panel-body"></div>
</aside>
<script>
const SKILLS = [
  ['Attack', 'Atk'], ['Strength', 'Str'], ['Defence', 'Def'], ['Hitpoints', 'HP'],
  ['Ranged', 'Rng'], ['Prayer', 'Pry'], ['Magic', 'Mag'], ['Cooking', 'Cook'],
  ['Woodcutting', 'WC'], ['Fletching', 'Flet'], ['Fishing', 'Fish'], ['Firemaking', 'FM'],
  ['Crafting', 'Craft'], ['Smithing', 'Smith'], ['Mining', 'Mine'], ['Herblore', 'Herb'],
  ['Agility', 'Agil'], ['Thieving', 'Thiev'], ['Runecraft', 'RC'],
];
const COMBAT = ['Attack', 'Strength', 'Defence', 'Hitpoints', 'Ranged', 'Prayer', 'Magic'];
const ICON = {
  Attack: 0, Strength: 1, Defence: 2, Ranged: 3, Prayer: 4, Magic: 5, Hitpoints: 6,
  Agility: 7, Herblore: 8, Thieving: 9, Crafting: 10, Fletching: 11, Mining: 12,
  Smithing: 13, Fishing: 14, Cooking: 15, Firemaking: 16, Woodcutting: 17,
};
const SCRIPT_SKILLS = {
  'thieving-route.ts': ['Thieving'],
  'fishing-route.ts': ['Fishing'],
  'mining-guild.ts': ['Mining'],
  'rune-rocks.ts': ['Mining'],
  'rimmington-iron.ts': ['Mining', 'Smithing'],
  'seers-wc-fm.ts': ['Woodcutting', 'Firemaking'],
  'magic-trees.ts': ['Woodcutting'],
  'agility-route.ts': ['Agility'],
  'wildy-course.ts': ['Agility'],
  'gnome-course.ts': ['Agility'],
  'herblore.ts': ['Herblore'],
  'catherby-cook-bank.ts': ['Cooking'],
  'bank-fletch.ts': ['Fletching'],
  'high-alch.ts': ['Magic'],
  'essence.ts': ['Runecraft'],
  'nature-essence-run.ts': ['Runecraft'],
  'green-dragons.ts': ['Ranged', 'Hitpoints'],
  'red-dragons.ts': ['Ranged', 'Hitpoints'],
  'kbd-range.ts': ['Ranged', 'Hitpoints'],
  'wildy-range.ts': ['Ranged'],
  'edgeville-range-druids.ts': ['Ranged'],
  'edgeville-dungeon-melee.ts': ['Attack', 'Strength', 'Defence'],
  'hobgoblins.ts': ['Attack', 'Strength'],
  'smith-knives.ts': ['Smithing'],
  'smelt-falador.ts': ['Smithing'],
};
const state = { fleet: null, tab: 'fleet', edits: new Map(), jobs: new Map(), openJobs: new Set(), closedGroups: new Set() };

const $ = (id) => document.getElementById(id);

function mapUrl(name) {
  return `https://maxbittker.github.io/rs-world/?follow=${encodeURIComponent(name)}&v=1`;
}

let mapFollow = null;
let mapTimer = null;

function mapAnchor(name, label) {
  const link = el('a', { href: mapUrl(name), text: label, title: 'Open the map' });
  link.addEventListener('click', (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
    event.preventDefault();
    openMap(name);
  });
  return link;
}

function closeMap() {
  $('map-modal').hidden = true;
  if (mapTimer) clearInterval(mapTimer);
  mapTimer = null;
  mapFollow = null;
  $('map-frame').src = 'about:blank';
}

async function loadMapCard(name) {
  const res = await fetch(`/api/bots/${encodeURIComponent(name)}/state`);
  const payload = await res.json();
  if (mapFollow !== name) return;
  $('map-body').replaceChildren(...renderChrome(payload));
}

let mapHit = 0;

function mapNames() {
  const names = (state.fleet?.bots || []).map((bot) => bot.name);
  if (mapFollow && !names.includes(mapFollow)) names.unshift(mapFollow);
  return names;
}

function mapQueryHits() {
  const q = $('map-account').value.trim().toLowerCase();
  return mapNames().filter((name) => name.toLowerCase().includes(q));
}

function hideMapHits() {
  mapHit = 0;
  $('map-hits').hidden = true;
  $('map-hits').replaceChildren();
}

function renderMapHits() {
  const box = $('map-hits');
  if ($('map-account').value.trim() === (mapFollow || '')) {
    hideMapHits();
    return;
  }
  const hits = mapQueryHits().slice(0, 12);
  if (!hits.length) {
    box.hidden = false;
    box.replaceChildren(el('p', { class: 'note', text: 'No account' }));
    return;
  }
  mapHit = Math.max(0, Math.min(mapHit, hits.length - 1));
  box.hidden = false;
  box.replaceChildren(...hits.map((name, i) => el('button', {
    type: 'button',
    class: i === mapHit ? 'on' : '',
    text: name,
    onmousedown: (event) => {
      event.preventDefault();
      openMap(name);
    },
  })));
}

function pickMapHit() {
  const q = $('map-account').value.trim().toLowerCase();
  const exact = mapNames().find((name) => name.toLowerCase() === q);
  const hits = mapQueryHits();
  const choice = exact || (hits.length === 1 ? hits[0] : hits[mapHit]);
  if (choice) openMap(choice);
  else $('map-account').value = mapFollow || '';
}

function openMap(name) {
  const same = mapFollow === name && !$('map-modal').hidden;
  mapFollow = name;
  $('map-modal').hidden = false;
  hideMapHits();
  $('map-account').value = name;
  $('map-tab').href = mapUrl(name);
  if (!same) $('map-frame').src = mapUrl(name);
  $('map-body').replaceChildren(el('p', { class: 'note', text: 'Loading…' }));
  loadMapCard(name).catch((err) => {
    if (mapFollow === name) $('map-body').replaceChildren(el('p', { text: err.message }));
  });
  if (mapTimer) clearInterval(mapTimer);
  mapTimer = setInterval(() => {
    if ($('map-modal').hidden || !mapFollow) return;
    loadMapCard(mapFollow).catch(() => undefined);
  }, 8000);
}

function skillLevel(levels, name) {
  if (!levels) return null;
  if (levels[name] != null) return levels[name];
  const aliases = name === 'Runecraft' ? ['runecraft', 'runecrafting'] : [name.toLowerCase()];
  for (const [key, value] of Object.entries(levels)) {
    if (aliases.includes(key.toLowerCase())) return value;
  }
  return null;
}

function age(ms) {
  if (ms == null || Number.isNaN(ms)) return '';
  if (ms < 1500) return 'now';
  const s = Math.round(ms / 1000);
  if (s < 90) return `${s}s`;
  const m = Math.round(s / 60);
  if (m < 90) return `${m}m`;
  return `${Math.round(m / 60)}h`;
}

function kindClass(kind) {
  if (kind === 'producing') return 'producing';
  if (kind === 'paused') return 'paused';
  if (kind === 'swarm') return 'swarm';
  if (kind === 'restartable' || kind === 'finished') return 'warn';
  return 'bad';
}

function rates(bot) {
  const xp = Object.entries(bot.xpPerHour || {})
    .filter(([, value]) => value > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 2)
    .map(([name, value]) => `${(SKILLS.find(([full]) => full === canonSkill(name)) || [name, name.slice(0, 4)])[1]} ${shortNum(value)} xp/h`);
  if (bot.gpPerHour) xp.push(`${Math.round(bot.gpPerHour).toLocaleString()} gp/h`);
  return xp.join(' · ');
}

function rateLabel(bot) {
  const top = Object.entries(bot.xpPerHour || {})
    .filter(([, value]) => value > 0)
    .sort((a, b) => b[1] - a[1])[0];
  if (top) return `${shortNum(top[1])}/h`;
  if (bot.gpPerHour) return `${shortNum(bot.gpPerHour)} gp`;
  return '';
}

function canonSkill(name) {
  const want = String(name).toLowerCase();
  for (const [full] of SKILLS) if (full.toLowerCase() === want) return full;
  if (want.startsWith('runecraft')) return 'Runecraft';
  return null;
}

function skillIcon(name) {
  const icon = el('i', { class: name === 'Runecraft' ? 'si rc' : 'si', 'aria-hidden': 'true' });
  const index = ICON[name];
  if (index != null) {
    icon.style.backgroundPosition = `${-(index % 6) * 16}px ${-Math.floor(index / 6) * 16}px`;
  }
  return icon;
}

function hotSkills(bot) {
  const hot = new Set();
  for (const [name, value] of Object.entries(bot.xpPerHour || {})) {
    if (value > 0) {
      const canon = canonSkill(name);
      if (canon) hot.add(canon);
    }
  }
  const file = (bot.script || '').split('/').pop();
  for (const name of SCRIPT_SKILLS[file] || []) hot.add(name);
  return hot;
}

function skillStrip(bot) {
  const hot = hotSkills(bot);
  const extra = [...hot].filter((name) => !COMBAT.includes(name));
  const wrap = el('div', {
    class: 'skills',
    title: bot.levels ? 'Combat and the skill this account is training. Click for every skill.' : 'No client levels on the latest heartbeat',
  });
  const add = (name, extraClass) => {
    const level = skillLevel(bot.levels, name);
    const chip = el('span', {
      class: `skill${hot.has(name) ? ' hot' : ''}${level === 99 ? ' max' : ''}${extraClass ? ' ' + extraClass : ''}`,
      title: `${name} ${level ?? '—'}`,
    });
    chip.append(skillIcon(name), el('b', { text: level == null ? '–' : String(level) }));
    wrap.append(chip);
  };
  for (const name of COMBAT) add(name);
  for (const name of extra) add(name, 'extra');
  wrap.addEventListener('click', (event) => {
    event.stopPropagation();
    openSkillPop(bot, wrap);
  });
  return wrap;
}

function openSkillPop(bot, anchor) {
  const pop = $('skill-pop');
  if (pop.dataset.name === bot.name && !pop.hidden) {
    pop.hidden = true;
    return;
  }
  pop.dataset.name = bot.name;
  const items = SKILLS.map(([name]) => {
    const level = skillLevel(bot.levels, name);
    return el('div', { class: 'pop-skill' }, [
      skillIcon(name),
      el('span', { text: name }),
      el('b', { class: level === 99 ? 'lvl99' : level === 1 ? 'lvl1' : '', text: level == null ? '—' : String(level) }),
    ]);
  });
  const foot = bot.levels
    ? `Combat ${combatLevel(bot.levels)} · total ${totalLevel(bot.levels)} · ${bot.qp == null ? 'no quest records' : `${bot.qp} QP from ${bot.questsDone} fleet quests`}`
    : bot.qp == null ? '' : `${bot.qp} QP from ${bot.questsDone} fleet quests`;
  pop.replaceChildren(
    el('h3', { text: bot.levels ? `${bot.name} skills` : `${bot.name} — no client levels yet` }),
    ...items,
    ...(foot ? [el('div', { class: 'pop-foot', text: foot })] : []),
  );
  pop.hidden = false;
  const rect = anchor.getBoundingClientRect();
  pop.style.left = '0px';
  pop.style.top = '0px';
  let left = Math.min(rect.left, window.innerWidth - pop.offsetWidth - 8);
  let top = rect.bottom + 4;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, rect.top - pop.offsetHeight - 4);
  pop.style.left = `${Math.max(8, left)}px`;
  pop.style.top = `${top}px`;
}

function shortNum(value) {
  const n = Math.round(value);
  if (Math.abs(n) >= 10000) return `${Math.round(n / 1000)}k`;
  if (Math.abs(n) >= 1000) return `${(n / 1000).toFixed(1)}k`;
  return String(n);
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
    else if (value != null) node.setAttribute(key, value);
  }
  for (const child of children || []) node.append(child);
  return node;
}

function visibleBots() {
  const q = $('q').value.trim().toLowerCase();
  const view = $('view').value;
  const kind = $('kind').value;
  return (state.fleet?.bots || []).filter((bot) => {
    if (view !== 'all' && bot.view !== view) return false;
    if (kind === 'not' && (bot.kind === 'producing' || bot.kind === 'paused' || bot.kind === 'swarm')) return false;
    if (kind === 'swarm' && bot.kind !== 'swarm') return false;
    if (kind === 'producing' && bot.kind !== 'producing') return false;
    if (kind === 'paused' && bot.kind !== 'paused') return false;
    if (!q) return true;
    return [bot.name, bot.view, bot.kind, bot.reason, bot.script, bot.extra, bot.activity, bot.area].join(' ').toLowerCase().includes(q);
  });
}

function scriptSelect(bot) {
  const edit = state.edits.get(bot.name);
  const select = el('select', { 'aria-label': `${bot.name} script`, title: edit?.script || bot.script });
  const scripts = state.fleet.scripts.slice();
  if (bot.script && !scripts.includes(bot.script)) scripts.push(bot.script);
  for (const script of scripts) {
    const option = el('option', { value: script, text: script.replace('bots/quests/', '').replace(/\.ts$/, '') });
    if (script === (edit?.script || bot.script)) option.selected = true;
    select.append(option);
  }
  select.addEventListener('change', () => rememberEdit(bot));
  return select;
}

function rememberEdit(bot) {
  const row = document.querySelector(`#fleet [data-name="${CSS.escape(bot.name)}"]`);
  if (!row) return;
  state.edits.set(bot.name, {
    script: row.querySelector('select').value,
    extra: row.querySelector('input.extra').value,
  });
}

function actionButton(label, className, onClick) {
  return el('button', { type: 'button', class: className, text: label, onclick: onClick });
}

const ICONS = {
  chrome: `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#fff"/><path fill="#DB4437" d="M24 4a22 22 0 0 1 15.4 6.4H24l-5.2 9L9.2 11.2A22 22 0 0 1 24 4z"/><path fill="#0F9D58" d="M9.2 11.2A22 22 0 0 0 24 46l5.2-9L24 24 9.2 11.2z"/><path fill="#F4B400" d="M39.4 10.4A22 22 0 0 1 24 46l5.2-9H24l5.2-9h10.2z"/><circle cx="24" cy="24" r="8" fill="#4285F4"/><circle cx="24" cy="24" r="4.6" fill="#fff"/><circle cx="24" cy="24" r="3" fill="#4285F4"/></svg>`,
  lite: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3.2 2.4L7 14M12.2 15H17"/></svg>`,
  stop: `<span class="emoji" aria-hidden="true">🛑</span>`,
  reset: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4.5V10h-5.5"/></svg>`,
  pause: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg>`,
  play: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2l11 6.8-11 6.8V5.2z" fill="currentColor"/></svg>`,
  bank: `<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="17.2" rx="7" ry="2.5" fill="#a67c2d"/><ellipse cx="12" cy="14.6" rx="7" ry="2.5" fill="#c4923a"/><ellipse cx="12" cy="12" rx="7" ry="2.5" fill="#e2a85a"/><ellipse cx="12" cy="9.4" rx="7" ry="2.5" fill="#f3d7a1"/><ellipse cx="12" cy="9.4" rx="3.4" ry="1.15" fill="none" stroke="#8a6230" stroke-width="0.7"/></svg>`,
  live: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8.5h3.2L9.4 6h5.2l2.2 2.5H20v9.5H4V8.5z"/><circle cx="12" cy="13" r="2.7"/></svg>`,
  log: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3.5h8.2L19 7.2V20.5H7V3.5z"/><path d="M15 3.5V7.4H19M9.2 12h5.6M9.2 15.5h5.6"/></svg>`,
};

function iconButton(icon, title, className, onClick) {
  const button = el('button', {
    type: 'button',
    class: className ? `icon ${className}` : 'icon',
    title,
    'aria-label': title,
    onclick: onClick,
  });
  button.innerHTML = icon;
  return button;
}

const FRESH_MS = 8000;

/** 2004 combat formula from base levels. */
function combatLevel(levels) {
  if (!levels) return null;
  const lv = (name) => skillLevel(levels, name) ?? 1;
  const base = 0.25 * (lv('Defence') + lv('Hitpoints') + Math.floor(lv('Prayer') / 2));
  const melee = 0.325 * (lv('Attack') + lv('Strength'));
  const range = 0.325 * Math.floor(lv('Ranged') * 1.5);
  const mage = 0.325 * Math.floor(lv('Magic') * 1.5);
  return Math.floor(base + Math.max(melee, range, mage));
}

function totalLevel(levels) {
  if (!levels) return null;
  return SKILLS.reduce((sum, [name]) => sum + (skillLevel(levels, name) || 0), 0);
}

const KIND_LABEL = {
  producing: 'Producing',
  swarm: 'In swarm',
  paused: 'Paused',
  'needs-client': 'Needs client',
  capped: 'Restart capped',
  churning: 'Churning',
  'needs-supplies': 'Needs supplies',
  'foreign-owner': 'Foreign owner',
  'alive-not-producing': 'Not producing',
  finished: 'Finished',
  restartable: 'Restartable',
};

function kindLabel(kind) {
  return KIND_LABEL[kind] || String(kind || 'unknown').replace(/-/g, ' ');
}

function groupOf(bot) {
  if (bot.kind === 'producing') return 'producing';
  if (bot.kind === 'swarm') return 'swarm';
  if (bot.kind === 'paused') return 'paused';
  return 'attention';
}

/** Minutes → a health class against good/warn thresholds. */
function ageClass(ms, goodMs, warnMs) {
  if (ms == null) return 'dim';
  if (ms <= goodMs) return 'good';
  if (ms <= warnMs) return 'warn';
  return 'bad';
}

function metric(label, value, cls, title) {
  return el('div', { class: `metric ${cls || ''}`, title: title || '' }, [el('span', { text: label }), el('b', { text: value })]);
}

function healthStrip(bot) {
  const now = Date.now();
  const hb = bot.heartbeat;
  const hbMs = hb?.at != null ? now - hb.at : bot.minutesSinceSnapshot != null ? bot.minutesSinceSnapshot * 60000 : null;
  const progMs = hb?.lastProgressAt != null ? now - hb.lastProgressAt : null;
  const effMs = bot.minutesSinceEffect != null ? bot.minutesSinceEffect * 60000 : null;
  const maxR = state.fleet.maxRestarts ?? 4;
  const client = bot.stateAge == null
    ? metric('Client', bot.kind === 'swarm' ? 'swarm' : 'offline', bot.kind === 'swarm' ? 'dim' : 'bad', 'No live game state from the gateway')
    : metric('Client', bot.stateAge > FRESH_MS ? `stale ${age(bot.stateAge)}` : 'live', bot.stateAge > FRESH_MS ? 'warn' : 'good', `Game state ${age(bot.stateAge)} old`);
  const restarts = bot.relaunches1h ?? 0;
  return el('div', { class: 'health' }, [
    metric('Heartbeat', hbMs == null ? '—' : age(hbMs), ageClass(hbMs, 3 * 60000, 10 * 60000), hb?.at ? `Last heartbeat ${new Date(hb.at).toLocaleTimeString()}` : 'No heartbeat.log record'),
    metric('Progress', progMs == null ? '—' : age(progMs), ageClass(progMs, 5 * 60000, 20 * 60000), 'Since the job last reported progress (heartbeat lastProgressAt)'),
    metric('Effect', effMs == null ? 'none yet' : age(effMs), ageClass(effMs, 10 * 60000, 30 * 60000), `Since the last XP/item effect${bot.lastExit ? ` · last exit ${bot.lastExit}` : ''}${restarts ? ` · ${restarts}/${maxR} restarts this hour` : ''}`),
    client,
  ]);
}

/** What the account is doing: swarm job, quest or grind, with the job's phase. */
function nowBlock(bot) {
  const hb = bot.heartbeat;
  const job = el('div', { class: 'job' });
  let kindText = '';
  let mainText = '';
  if (bot.paused) {
    kindText = 'Paused';
    mainText = scriptName(bot.script) + (bot.extra ? ` ${bot.extra}` : '');
  } else if (bot.swarmJob) {
    kindText = 'Swarm';
    mainText = bot.swarmJob;
  } else if (hb?.quest) {
    kindText = 'Quest';
    mainText = hb.quest;
  } else if (hb?.job) {
    kindText = /todo-runner/.test(bot.script) ? 'After quests' : 'Grind';
    mainText = hb.job;
  } else {
    kindText = 'Job';
    mainText = scriptName(bot.script) || 'no roster script';
  }
  job.append(el('span', { class: 'kind-label', text: `${kindText} · ` }), mainText);
  if (hb?.phase && !bot.paused) job.append(el('span', { class: 'phase', text: hb.phase, title: 'Job phase from the heartbeat' }));
  job.title = `${kindText}: ${mainText}${hb?.phase ? ` (${hb.phase})` : ''}`;
  const logText = bot.lastLine?.text ? `${bot.lastLine.tag ? `[${bot.lastLine.tag}] ` : ''}${bot.lastLine.text}` : bot.activity ? lastLogText(bot.activity) : '';
  const line = logText ? el('div', { class: `line${/^(ERROR|WARN)\b/.test(logText) ? ' hot' : ''}`, text: logText, title: `Last grind.log line: ${logText}\n${bot.activity || ''}` }) : el('span');
  return el('div', { class: 'now' }, [job, line]);
}

function scriptName(script) {
  return (script || '').replace('bots/quests/', '').replace(/\.ts$/, '');
}

/** Activity labels read "<script> <args>: <last log line>"; the card shows the log line. */
function lastLogText(activity) {
  const i = activity.indexOf(': ');
  return i > 0 && !/^swarm /.test(activity) ? activity.slice(i + 2) : activity;
}

function qpBadge(bot) {
  const qp = bot.qp;
  const title = qp == null
    ? 'No todo-runner quest records for this account'
    : `${qp} quest points from ${bot.questsDone ?? 0} quests the fleet completed. Quests done by hand outside the fleet are not counted.`;
  return el('span', { class: qp == null ? 'qp none' : 'qp', title }, [qp == null ? '—' : String(qp), el('small', { text: 'QP' })]);
}

function botCard(bot) {
  const edit = state.edits.get(bot.name);
  const stale = bot.stateAge == null || bot.stateAge > FRESH_MS;
  const where = bot.stateAge == null
    ? 'no live position'
    : stale
      ? `stale ${age(bot.stateAge)}`
      : (bot.area || (bot.x == null ? 'Map' : `${bot.x}, ${bot.z}`));
  const coordNote = bot.x == null ? '' : `${bot.x}, ${bot.z}`;
  const maxR = state.fleet.maxRestarts ?? 4;
  const capped = bot.shepherdCapped || (bot.relaunches1h != null && bot.relaunches1h >= maxR);
  const pos = mapAnchor(bot.name, where);
  pos.title = [coordNote, bot.stateAge == null ? 'no state yet' : `state ${age(bot.stateAge)}`, 'Open the map'].filter(Boolean).join(' · ');

  const head = el('div', { class: 'card-head' }, [
    el('span', { class: `dot ${kindClass(bot.kind)}` }),
    el('button', { type: 'button', class: 'name-btn', text: bot.name, title: `Open map · ${bot.kind}: ${bot.reason}`, onclick: () => openMap(bot.name) }),
    bot.view ? el('span', { class: 'tag', text: bot.view }) : el('span'),
  ]);
  if (bot.pauseSource === 'food-hub') head.append(el('span', { class: 'badge hub', text: 'hub', title: 'Paused by the food-hub lock. skip-bots will not release it.' }));
  const cb = combatLevel(bot.levels);
  const total = totalLevel(bot.levels);
  head.append(qpBadge(bot));
  if (cb != null) head.append(el('span', { class: 'cb', title: `Combat ${cb} · total level ${total}` }, ['Cb ', el('b', { text: String(cb) })]));

  const status = el('div', { class: 'status', title: `${bot.kind}: ${bot.reason}` }, [
    el('span', { class: `pill ${kindClass(bot.kind)}`, text: kindLabel(bot.kind) }),
    el('span', { class: 'reason', text: bot.reason || '' }),
  ]);

  const rate = rates(bot);
  const meta = el('div', { class: 'meta' }, [
    el('span', { class: stale ? 'pos stale' : 'pos' }, [pos]),
  ]);
  if (rate) meta.append(el('span', { class: 'rate', text: rate }));
  if (total != null) meta.append(el('span', { text: `Total ${total}` }));
  if (bot.relaunches1h != null && bot.relaunches1h >= Math.max(1, maxR - 1)) {
    meta.append(el('span', { class: 'pill warn', text: `↻ ${bot.relaunches1h}/${maxR}`, title: 'Restarts in the last hour' }));
  }

  const select = scriptSelect(bot);
  const extra = el('input', {
    class: 'extra',
    type: 'text',
    value: edit?.extra ?? bot.extra,
    placeholder: 'args',
    'aria-label': `${bot.name} args`,
  });
  extra.addEventListener('input', () => rememberEdit(bot));
  const apply = actionButton('Set', 'primary', () => applyScript(bot.name));
  apply.title = 'Save this script and switch the launch agent (drains to a bank first)';
  const jobEdit = el('details', { class: 'job-edit' }, [
    el('summary', { title: bot.command || '' }, ['Roster job ', el('code', { text: `${scriptName(bot.script) || 'none'}${bot.extra ? ' ' + bot.extra.replace(/bots\/quests\//g, '').replace(/\.ts\b/g, '') : ''}` })]),
    el('div', { class: 'script-cell' }, [select, extra, apply]),
  ]);
  if (state.openJobs.has(bot.name) || edit) jobEdit.open = true;
  jobEdit.addEventListener('toggle', () => {
    if (jobEdit.open) state.openJobs.add(bot.name);
    else state.openJobs.delete(bot.name);
  });

  const resetBtn = iconButton(ICONS.reset, capped ? `Restart budget spent (${bot.relaunches1h ?? maxR}/${maxR}) — wait for the hour to roll` : 'Restart the roster script', '', () => run(bot.name, 'restart', `Restart ${bot.name} on its roster script?`));
  if (capped) resetBtn.disabled = true;
  const actions = el('div', { class: 'actions' }, [
    iconButton(ICONS.live, 'Inventory, worn gear, nearby, and chat', '', () => openState(bot.name)),
    iconButton(ICONS.log, 'Log tail', '', () => openLog(bot.name)),
    iconButton(ICONS.bank, 'Bank', '', () => openBank(bot.name)),
    el('span', { class: 'sep' }),
    resetBtn,
    iconButton(bot.paused ? ICONS.play : ICONS.pause, bot.paused ? 'Unpause' : 'Pause', '', () => togglePause(bot)),
    iconButton(ICONS.stop, 'Stop the script (drains to a bank first)', 'danger', () => run(bot.name, 'stop', `Stop ${bot.name}? It banks first, then launchd leaves it stopped.`)),
    el('span', { class: 'sep' }),
    iconButton(ICONS.chrome, 'Open Chrome', '', () => run(bot.name, 'chrome', `Open Chrome for ${bot.name}? Lite stops, then the grind restarts once the window is in game.`)),
    iconButton(ICONS.lite, 'Back to lite', '', () => run(bot.name, 'lite', `Move ${bot.name} back to the headless client?`)),
  ]);

  return el('article', { class: `card ${kindClass(bot.kind)}`, 'data-name': bot.name }, [
    head,
    status,
    nowBlock(bot),
    healthStrip(bot),
    meta,
    skillStrip(bot),
    el('div', { class: 'card-foot' }, [actions, jobEdit]),
  ]);
}

const GROUPS = [
  ['attention', 'Needs attention', 'bad', 'Not producing: logged out, capped, churning, short of supplies or finished'],
  ['producing', 'Producing', 'good', 'Running their roster job and showing effects'],
  ['swarm', 'In the swarm', 'swarm', 'Played by the shared swarm process'],
  ['paused', 'Paused', 'paused', 'On skip-bots or held by the food-hub lock'],
];

function renderFleet(opts) {
  const active = document.activeElement;
  const typing = !opts?.force && active && active.closest('#fleet') && active.matches('input, select');
  if (typing) return;
  $('skill-pop').hidden = true;
  const root = $('fleet');
  const bots = visibleBots();
  const sections = [];
  for (const [id, title, tone, hint] of GROUPS) {
    const members = bots.filter((bot) => groupOf(bot) === id);
    if (!members.length) continue;
    const section = el('details', { class: `section ${tone}`, 'data-group': id }, [
      el('summary', {}, [
        el('h2', { text: title }),
        el('span', { class: 'count', text: String(members.length) }),
        el('span', { class: 'hint', text: hint }),
      ]),
      el('div', { class: 'grid' }, members.map(botCard)),
    ]);
    section.open = !state.closedGroups.has(id);
    section.addEventListener('toggle', () => {
      if (section.open) state.closedGroups.delete(id);
      else state.closedGroups.add(id);
    });
    sections.push(section);
  }
  if (!sections.length) sections.push(el('p', { class: 'empty', text: state.fleet.bots.length ? 'No account matches the filters.' : 'No accounts in the fleet payload.' }));
  root.replaceChildren(...sections);
}

function tile(label, value, caption, tone, opts) {
  const node = el(opts?.onclick ? 'button' : 'div', { class: `tile ${tone || ''}`, title: opts?.title || '' }, [
    el('span', { class: 'k', text: label }),
    el('span', { class: 'v', text: value }),
    el('span', { class: 'c', text: caption || '' }),
  ]);
  if (opts?.onclick) {
    node.type = 'button';
    node.addEventListener('click', opts.onclick);
    node.setAttribute('aria-pressed', String(!!opts.pressed));
  }
  return node;
}

function renderSummary() {
  const fleet = state.fleet;
  const bots = fleet.bots || [];
  const kindFilter = $('kind').value;
  const filterTo = (value) => () => {
    $('kind').value = $('kind').value === value ? 'all' : value;
    if (state.tab !== 'fleet') setTab('fleet');
    else render();
  };
  const attention = bots.filter((bot) => groupOf(bot) === 'attention');
  const qp = fleet.questPoints || {};
  const withQp = bots.filter((bot) => bot.qp != null);
  const avg = withQp.length ? Math.round(withQp.reduce((sum, bot) => sum + bot.qp, 0) / withQp.length) : 0;
  const top = withQp.slice().sort((a, b) => b.qp - a.qp)[0];
  $('summary').replaceChildren(
    tile('Producing', String(fleet.producing ?? 0), `of ${bots.length} accounts`, 'good', { onclick: filterTo('producing'), pressed: kindFilter === 'producing', title: 'Show only producing accounts' }),
    tile('In swarm', String(fleet.swarmed ?? 0), 'shared swarm process', 'swarm', { onclick: filterTo('swarm'), pressed: kindFilter === 'swarm', title: 'Show only swarm accounts' }),
    tile('Need attention', String(attention.length), attention.slice(0, 4).map((bot) => bot.name).join(', ') + (attention.length > 4 ? ` +${attention.length - 4}` : ''), attention.length ? 'bad' : 'good', { onclick: filterTo('not'), pressed: kindFilter === 'not', title: attention.map((bot) => `${bot.name}: ${bot.reason}`).join('\n') }),
    tile('Paused', String(fleet.paused ?? 0), 'skip-bots / food hub', 'paused', { onclick: filterTo('paused'), pressed: kindFilter === 'paused', title: 'Show only paused accounts' }),
    tile('Quest points', (qp.total ?? 0).toLocaleString(), withQp.length ? `fleet-run quests · avg ${avg} · top ${top.qp}` : 'no quest records', 'qptile', { title: qp.source || 'From completed quests the fleet ran' }),
  );
}

function renderStats() {
  const head = $('stats-head');
  head.replaceChildren(
    el('th', { class: 'account', text: 'Account' }),
    el('th', { class: 'num', text: 'QP', title: 'Quest points from completed quests the fleet ran' }),
    el('th', { class: 'num', text: 'Cb' }),
    el('th', { class: 'num', text: 'Tot' }),
    ...SKILLS.map(([name]) => {
      const th = el('th', { class: 'num', title: name });
      th.append(skillIcon(name));
      return th;
    })
  );
  const body = document.querySelector('#stats tbody');
  body.replaceChildren();
  for (const bot of visibleBots()) {
    const cells = SKILLS.map(([name]) => {
      const value = skillLevel(bot.levels, name);
      const cls = value === 99 ? 'num lvl99' : value === 1 ? 'num lvl1' : 'num';
      return el('td', { class: cls, text: value == null ? '' : String(value) });
    });
    const total = totalLevel(bot.levels);
    const cb = combatLevel(bot.levels);
    body.append(el('tr', {}, [
      el('td', { class: 'account' }, [
        el('button', {
          type: 'button',
          class: 'name-btn',
          text: bot.name,
          title: 'Open map',
          onclick: () => openMap(bot.name),
        }),
        el('div', { class: 'muted', text: bot.levels ? bot.view : 'no client levels on the latest heartbeat' }),
      ]),
      el('td', { class: 'num qpcell', text: bot.qp == null ? '—' : String(bot.qp), title: bot.qp == null ? 'No quest records' : `${bot.questsDone} quests completed by the fleet` }),
      el('td', { class: 'num', text: cb == null ? '—' : String(cb) }),
      el('td', { class: 'num', text: total == null ? '—' : String(total) }),
      ...cells,
    ]));
  }
}

const QUEST_MARK = { done: '✓', running: '▶', queued: '·', retrying: '↻', failed: '✗', stock: '$' };
const QUEST_WORD = {
  done: 'done',
  running: 'running now',
  queued: 'queued',
  retrying: 'failed once, will retry',
  failed: 'gave up after 2 failures',
  stock: 'needs mule stock',
};
let questsLoading = false;

async function loadQuests() {
  if (questsLoading) return;
  questsLoading = true;
  try {
    const res = await fetch('/api/quests');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.quests = await res.json();
  } catch (err) {
    state.questsError = String(err);
  } finally {
    questsLoading = false;
  }
  if (state.tab === 'quests') render();
}

function renderQuests() {
  const goal = $('quest-goal');
  const data = state.quests;
  if (!data) {
    goal.textContent = state.questsError ? `Quests unavailable: ${state.questsError}` : 'Loading quests…';
    return;
  }
  const g = data.goal;
  const since = new Date(data.since).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const peak = Math.max(1, ...g.perHour.map((h) => h.count));
  const spark = el('span', { class: 'spark', title: g.perHour.map((h) => `${new Date(h.hour).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} ${h.count}`).join('\n') },
    g.perHour.map((h) => el('i', { style: `height:${Math.max(2, Math.round((h.count / peak) * 22))}px` })));
  const stat = (n, label, bad) => el('span', { class: bad && n ? 'bad' : '' }, [el('b', { text: String(n) }), ` ${label}`]);
  const qp = data.questPoints;
  goal.className = '';
  goal.replaceChildren(
    stat(g.completedSince, `quests completed since ${since}`),
    spark,
    stat(g.completedLastHour, 'in the last hour'),
    stat(g.running, 'running'),
    stat(g.queued, 'queued'),
    stat(g.failedLastHour, 'failed in the last hour', true),
    stat(g.stock, 'waiting on mule stock', true),
    qp ? stat(qp.total.toLocaleString(), `fleet quest points`) : el('span'),
    el('span', { class: 'legend' }, Object.entries(QUEST_MARK).map(([key, mark]) => el('span', { class: `qc ${key}`, text: `${mark} ${QUEST_WORD[key]}` }))),
    el('span', { class: 'muted', text: `· ${new Date(data.generatedAt).toLocaleTimeString()}` }),
    el('p', { class: 'note', text: `${data.columns.filter((c) => !c.miniquest).length} of the game's ${qp?.quests ?? '?'} quests are on the fleet's lists${data.columns.some((c) => c.miniquest) ? ', plus the Barcrawl miniquest' : ''}. Top-ups, handovers, musters and grinds are left out; re-queued variants (waterfall-rel, grail-pre2…) are merged into their quest. ${qp?.source ?? ''}` }),
  );
  $('quests-head').replaceChildren(
    el('th', { class: 'account', text: 'Account' }),
    el('th', { class: 'qp-head', text: 'QP', title: qp?.source ?? '' }),
    ...data.columns.map((c) => {
      const label = c.miniquest ? `${c.label} (miniquest)` : c.label;
      const kind = c.miniquest ? 'miniquest, no quest points' : `${c.qp} QP · ${c.members ? 'members' : 'free'}`;
      return el('th', { class: `q${c.miniquest ? ' mini' : c.members ? '' : ' free'}`, title: `${label} · ${kind}: ${c.done} done of ${c.listed} accounts` }, [
        `${label} `, el('small', { text: `${c.done}/${c.listed}` }),
      ]);
    }),
  );
  const q = $('q').value.trim().toLowerCase();
  const body = document.querySelector('#quests tbody');
  body.replaceChildren();
  for (const row of data.rows) {
    if (q && !row.name.toLowerCase().includes(q)) continue;
    const failed = Object.values(row.cells).some((c) => c.state === 'failed');
    body.append(el('tr', { class: failed ? 'bad' : '' }, [
      el('td', { class: 'account' }, [
        el('button', { type: 'button', class: 'name-btn', text: row.name, title: 'Open map', onclick: () => openMap(row.name) }),
        el('div', { class: 'muted', text: row.running ? `▶ ${data.columns.find((c) => c.id === row.running)?.label ?? row.running}` : `${row.done} done` }),
      ]),
      el('td', { class: 'qpcell', text: String(row.qp), title: `${row.qp} quest points from ${row.done} completed quests` }),
      ...data.columns.map((c) => {
        const cell = row.cells[c.id];
        if (!cell) return el('td', { class: 'qc' });
        const merged = cell.ids ? ` · todo ids ${cell.ids.join(', ')}` : '';
        return el('td', {
          class: `qc ${cell.state}`,
          text: QUEST_MARK[cell.state],
          title: `${row.name} · ${c.label}: ${QUEST_WORD[cell.state]}${cell.note ? ` (${cell.note})` : ''}${merged}`,
        });
      }),
    ]));
  }
}

function render(opts) {
  const fleet = state.fleet;
  if (!fleet) return;
  const tableWrap = state.tab === 'stats' ? $('stats-wrap') : state.tab === 'quests' ? $('quests-wrap') : null;
  const scrollTop = tableWrap ? tableWrap.scrollTop : 0;
  const scrollLeft = tableWrap ? tableWrap.scrollLeft : 0;
  const headline = $('headline');
  headline.textContent = fleet.headline;
  headline.className = fleet.notProducing.length || fleet.gatewayDown ? 'headline bad' : 'headline';
  const banner = $('gateway-banner');
  if (fleet.gatewayDown) {
    banner.hidden = false;
    banner.textContent = `Gateway unreachable — positions and states are frozen, not live. Don't restart the fleet for this; fix the gateway connection first.${fleet.gatewayError ? ` (${fleet.gatewayError})` : ''}`;
  } else {
    banner.hidden = true;
    banner.textContent = '';
  }
  const when = new Date(fleet.generatedAt).toLocaleTimeString();
  const dataAgeMs = Date.now() - new Date(fleet.generatedAt).getTime();
  const dataAge = dataAgeMs > 10000 ? ` · data ${age(dataAgeMs)} old` : '';
  $('sub').textContent = `snapshot ${when}${dataAge}`;
  const view = $('view');
  const current = view.value || 'all';
  view.replaceChildren(el('option', { value: 'all', text: 'All views' }));
  for (const name of fleet.views) view.append(el('option', { value: name, text: name }));
  view.value = [...view.options].some((option) => option.value === current) ? current : 'all';
  renderSummary();
  $('fleet').hidden = state.tab !== 'fleet';
  $('stats-wrap').hidden = state.tab !== 'stats';
  $('quests-wrap').hidden = state.tab !== 'quests';
  if (state.tab === 'fleet') renderFleet(opts);
  else if (state.tab === 'quests') renderQuests();
  else renderStats();
  if (tableWrap) {
    tableWrap.scrollTop = scrollTop;
    tableWrap.scrollLeft = scrollLeft;
  }
}


let loadSeq = 0;
let refreshing = false;

async function loadFleet(fresh = false) {
  const seq = ++loadSeq;
  const res = await fetch(fresh ? '/api/fleet?fresh=1' : '/api/fleet');
  const body = await res.json();
  if (seq !== loadSeq) return;
  if (!res.ok) throw new Error(body.error || res.statusText);
  state.fleet = body;
  render(fresh ? { force: true } : undefined);
}

function setRefreshing(on) {
  refreshing = on;
  const btn = $('refresh');
  btn.disabled = on;
  btn.classList.toggle('busy', on);
  btn.setAttribute('aria-busy', String(on));
}

async function refreshNow() {
  if (refreshing) return;
  setRefreshing(true);
  try {
    await loadFleet(true);
    if (state.tab === 'quests') await loadQuests();
  } catch (err) {
    showToast('Refresh failed', err.message, 'bad');
  } finally {
    setRefreshing(false);
  }
}

function showToast(title, detail, tone) {
  const box = el('div', { class: 'toast' }, [
    el('strong', { text: title }),
    el('pre', { text: detail || '' }),
  ]);
  if (tone === 'bad') box.style.borderColor = 'var(--bad)';
  $('toast').prepend(box);
  while ($('toast').children.length > 4) $('toast').lastChild.remove();
  return box;
}

function track(job) {
  if (!job?.id) return Promise.resolve();
  state.jobs.set(job.id, job);
  const card = showToast(`${job.name} ${job.action}`, 'Running…');
  return new Promise((resolve) => {
    const tick = async () => {
      const res = await fetch(`/api/jobs/${job.id}`);
      const next = await res.json();
      if (!res.ok) {
        resolve();
        return;
      }
      state.jobs.set(job.id, next);
      const title = card.querySelector('strong');
      const pre = card.querySelector('pre');
      if (title) title.textContent = `${next.name} ${next.action} ${next.status === 'running' ? '' : next.status}`.trim();
      if (pre) pre.textContent = (next.output || next.status).trim();
      if (next.status === 'failed') card.style.borderColor = 'var(--bad)';
      if (next.status === 'running') {
        setTimeout(tick, 1000);
        return;
      }
      resolve();
      loadFleet().catch((err) => showToast('Refresh failed', err.message, 'bad'));
    };
    setTimeout(tick, 800);
  });
}

async function checkBanks() {
  const btn = $('banks');
  if (btn.disabled) return;
  if (!confirm('Stop every running grind, log in accounts that have no live client, open every roster bank, then start those grinds again?\n\nskip-bots are not force-logged in. Paused accounts are checked and left stopped.')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/fleet/banks', { method: 'POST' });
    const body = await res.json();
    if (!res.ok) {
      showToast('Check banks', body.error || res.statusText, 'bad');
      return;
    }
    await track(body);
  } catch (err) {
    showToast('Check banks', err.message, 'bad');
  } finally {
    btn.disabled = false;
  }
}

async function run(name, action, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  const res = await fetch(`/api/bots/${encodeURIComponent(name)}/${action}`, { method: 'POST' });
  const body = await res.json();
  if (!res.ok) {
    showToast(`${name} ${action}`, body.error || res.statusText, 'bad');
    return;
  }
  track(body);
}

async function applyScript(name) {
  const row = document.querySelector(`#fleet [data-name="${CSS.escape(name)}"]`);
  const script = row.querySelector('select').value;
  const extra = row.querySelector('input.extra').value.trim();
  const label = script.replace('bots/quests/', '');
  if (!confirm(`Switch ${name} to ${label}${extra ? ' ' + extra : ''}? It banks first, then starts the new job from a bank.`)) return;
  const res = await fetch(`/api/bots/${encodeURIComponent(name)}/script`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ script, extra }),
  });
  const body = await res.json();
  if (!res.ok) {
    showToast(`${name} script`, body.error || res.statusText, 'bad');
    return;
  }
  state.edits.delete(name);
  if (body.paused) showToast(name, 'Saved. Still paused, so the script was not started.');
  else track(body.job);
}

async function togglePause(bot) {
  const pausing = !bot.paused;
  const text = pausing
    ? `Pause ${bot.name}? They go on skip-bots and the script stops.`
    : `Unpause ${bot.name}? They stay stopped until you hit Restart.`;
  if (!confirm(text)) return;
  const res = await fetch(`/api/bots/${encodeURIComponent(bot.name)}/pause`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ paused: pausing }),
  });
  const body = await res.json();
  if (!res.ok) {
    showToast(bot.name, body.error || res.statusText, 'bad');
    return;
  }
  if (body.job) track(body.job);
  else {
    showToast(bot.name, pausing ? 'Paused' : 'Unpaused');
    loadFleet().catch((err) => showToast('Refresh failed', err.message, 'bad'));
  }
}

function openPanel(title, tools) {
  $('panel').hidden = false;
  $('panel-title').textContent = title;
  $('panel-tools').replaceChildren(...(tools || []));
  $('panel-body').replaceChildren(el('p', { class: 'note', text: 'Loading…' }));
}

async function openBank(name) {
  openPanel(`${name} bank`, [
    mapAnchor(name, 'Map'),
  ]);
  const res = await fetch(`/api/bots/${encodeURIComponent(name)}/bank`);
  const body = await res.json();
  if (!res.ok) {
    $('panel-body').replaceChildren(el('p', { text: body.error || 'Bank failed' }));
    return;
  }
  const note = body.source === 'live'
    ? 'Bank is open on the live client.'
    : body.source === 'snapshot'
      ? `Last snapshot ${new Date(body.capturedAt).toLocaleString()}${body.stale ? ' · older than a day' : ''}. The bank is closed right now, so this is the saved copy.`
      : 'No bank snapshot yet. This page does not walk the account to a bank.';
  const filter = el('input', { type: 'search', placeholder: 'Filter items', style: 'margin-bottom:8px;width:100%' });
  const table = el('table', { class: 'bank-table' });
  const renderItems = () => {
    const q = filter.value.trim().toLowerCase();
    const items = body.items
      .filter((item) => item.name.toLowerCase().includes(q))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    table.replaceChildren(
      el('thead', {}, [el('tr', {}, [el('th', { text: 'Item' }), el('th', { text: 'Count' })])]),
      el('tbody', {}, items.map((item) => el('tr', {}, [
        el('td', { text: item.name }),
        el('td', { text: item.count.toLocaleString() }),
      ])))
    );
  };
  filter.addEventListener('input', renderItems);
  renderItems();
  $('panel-body').replaceChildren(el('p', { class: 'note', text: note }), filter, table);
}

function itemIcon(item) {
  if (item == null || item.id == null) return el('span', { class: 'item-icon none' });
  const img = el('img', {
    class: 'item-icon',
    src: `/api/item-icon/${item.id}.png`,
    alt: '',
    loading: 'lazy',
    title: `${item.name} (#${item.id})`,
  });
  img.addEventListener('error', () => img.remove());
  return img;
}

function itemTable(items) {
  const table = el('table', { class: 'bank-table' });
  table.append(
    el('thead', {}, [el('tr', {}, [el('th', { text: '' }), el('th', { text: 'Item' }), el('th', { text: 'Count' })])]),
    el('tbody', {}, (items || []).map((item) => el('tr', {}, [
      el('td', { class: 'icon-cell' }, [itemIcon(item)]),
      el('td', { text: item.name }),
      el('td', { text: Number(item.count || 0).toLocaleString() }),
    ])))
  );
  return table;
}

function sceneRows(rows) {
  return el('div', {}, rows.map((row) => el('div', { class: 'scene-line', text: row })));
}

function block(title, node) {
  return el('section', { class: 'block' }, [
    el('h3', { text: title }),
    node,
  ]);
}

function liveSkills(skills) {
  const order = SKILLS.map(([name]) => name);
  const byName = new Map((skills || []).map((entry) => [entry.name, entry]));
  const row = el('div', { class: 'live-skills' });
  const add = (name) => {
    const skill = byName.get(name);
    if (!skill) return;
    const boosted = skill.level !== skill.baseLevel;
    const chip = el('span', {
      class: `skill${skill.baseLevel === 99 ? ' max' : ''}`,
      title: `${name} ${skill.level}/${skill.baseLevel}  ${Number(skill.xp || 0).toLocaleString()} xp`,
    });
    chip.append(...(ICON[name] != null || name === 'Runecraft' ? [skillIcon(name)] : []), el('b', { text: boosted ? `${skill.level}/${skill.baseLevel}` : String(skill.baseLevel) }));
    row.append(chip);
  };
  for (const name of order) add(name);
  for (const entry of skills || []) {
    if (!order.includes(entry.name)) add(entry.name);
  }
  return row;
}

function moreRows(rows, total) {
  if (total > rows.length) rows.push(`+${total - rows.length} more`);
  return rows.length ? sceneRows(rows) : el('p', { class: 'note', text: 'None' });
}

function renderScene(body) {
  if (body.error || !body.scene?.me) {
    return el('p', { class: 'note', text: body.error ? `Map: ${body.error}` : 'Map: no player state' });
  }
  const scene = body.scene;
  const RANGE = 20;
  const SIZE = 320;
  const scale = SIZE / (RANGE * 2 + 2);
  const canvas = el('canvas', { class: 'minimap', width: SIZE, height: SIZE });
  const ctx = canvas.getContext('2d');
  const dot = (x, z) => [(x - scene.me.x + RANGE + 1) * scale, (z - scene.me.z + RANGE + 1) * scale];
  ctx.fillStyle = '#101014';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.strokeStyle = '#2a2a33';
  ctx.lineWidth = 1;
  for (let g = -RANGE; g <= RANGE; g += 5) {
    const [ax] = dot(scene.me.x + g, scene.me.z);
    const [, bz] = dot(scene.me.x, scene.me.z + g);
    ctx.beginPath(); ctx.moveTo(ax, 0); ctx.lineTo(ax, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, bz); ctx.lineTo(SIZE, bz); ctx.stroke();
  }
  for (const loc of scene.locs || []) {
    const [x, y] = dot(loc.x, loc.z);
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(x - 2, y - 2, 4, 4);
  }
  for (const g of scene.ground || []) {
    const [x, y] = dot(g.x, g.z);
    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  for (const o of scene.players || []) {
    const [x, y] = dot(o.x, o.z);
    ctx.fillStyle = '#64b5f6';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  for (const n of scene.npcs || []) {
    const [x, y] = dot(n.x, n.z);
    ctx.fillStyle = n.fight ? '#ff7043' : '#e53935';
    ctx.beginPath(); ctx.arc(x, y, 2 + Math.min(n.sz || 1, 3), 0, Math.PI * 2); ctx.fill();
  }
  const [mx, my] = dot(scene.me.x, scene.me.z);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2); ctx.stroke();
  const nearNames = (scene.npcs || []).slice(0, 4).map((n) => n.n);
  const caption = [
    `${scene.me.x}, ${scene.me.z}`,
    `NPCs ${scene.npcs.length}`,
    `Players ${scene.players.length}`,
    body.stateAge > 8000 ? 'stale snapshot' : '',
    nearNames.length ? nearNames.join(' · ') : '',
  ].filter(Boolean).join('  ·  ');
  canvas.title = caption;
  return el('div', {}, [
    canvas,
    el('p', { class: 'note', text: caption }),
  ]);
}

function renderChrome(body, sceneBody) {
  if (body.error) return [el('p', { text: body.error })];
  const view = body.view;
  if (!view) return [el('pre', { text: body.text || 'No state' })];
  const player = view.player;
  const place = body.area ? `${body.area}  ` : '';
  const where = player ? `${player.name}  Cb ${player.combatLevel}  ${place}(${player.x}, ${player.z})  run ${player.runEnergy}%  ${player.runWeight}kg` : 'Not in game';
  const flags = [
    view.inGame ? '' : 'Not in game',
    player?.dead ? 'Dead' : '',
    view.bankOpen ? 'Bank open' : '',
    view.shop ? `Shop: ${view.shop}` : '',
    view.trade ? `Trade: ${view.trade}` : '',
    body.stateAge > 8000 ? 'Stale snapshot' : '',
  ].filter(Boolean);
  const inventory = [...(view.inventory || [])].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  const npcRows = view.npcs.map((npc) => {
    const lvl = npc.combatLevel > 0 ? `Lv${npc.combatLevel}` : '';
    const hp = npc.hp != null && npc.maxHp != null ? `${npc.hp}/${npc.maxHp}` : '';
    const opts = npc.options ? `[${npc.options}]` : '';
    return `${npc.name}  ${lvl}  ${hp}  ${npc.distance}t  ${opts}`.replace(/ +/g, ' ').trim();
  });
  const playerRows = view.players.map((other) => `${other.name}  Cb ${other.combatLevel}  ${other.distance}t`);
  const objectRows = view.objects.map((loc) => `${loc.name}  (${loc.x}, ${loc.z})  ${loc.distance}t${loc.options ? `  [${loc.options}]` : ''}`);
  const groundRows = view.ground.map((item) => `${item.name}  x${item.count}  ${item.distance}t`);
  const chat = [...(view.dialogOpen.length ? [`Dialog: ${view.dialogOpen.join(' · ')}`] : []), ...(view.messages || [])];
  const raw = el('details', { class: 'raw' }, [
    el('summary', { text: 'Raw text' }),
    el('pre', { text: body.text || '' }),
  ]);
  return [
    el('p', { class: 'who', text: where }),
    flags.length ? el('p', { class: 'note', text: flags.join(' · ') }) : el('span'),
    block('Map', renderScene(sceneBody || {})),
    liveSkills(view.skills),
    el('div', { class: 'split' }, [
      block(`Inventory ${inventory.length}`, inventory.length ? itemTable(inventory) : el('p', { class: 'note', text: 'Empty' })),
      block(`Worn ${view.worn.length}`, view.worn.length ? itemTable(view.worn) : el('p', { class: 'note', text: 'Nothing worn' })),
    ]),
    block(`NPCs ${view.npcCount}`, moreRows(npcRows.slice(0, 6), view.npcCount)),
    block(`Players ${view.playerCount}`, moreRows(playerRows.slice(0, 5), view.playerCount)),
    block(`Objects ${view.objectCount}`, moreRows(objectRows.slice(0, 6), view.objectCount)),
    block(`Ground ${view.groundCount}`, moreRows(groundRows.slice(0, 5), view.groundCount)),
    block('Chat', chat.length ? sceneRows(chat) : el('p', { class: 'note', text: 'None' })),
    block('Dialogs', view.dialogs.length ? sceneRows(view.dialogs) : el('p', { class: 'note', text: 'None' })),
    raw,
  ];
}

async function openState(name) {
  const paint = (payload, scene) => {
    $('panel-body').replaceChildren(...renderChrome(payload, scene));
  };
  const load = async () => {
    $('panel-body').replaceChildren(el('p', { class: 'note', text: 'Loading…' }));
    const [res, sceneRes] = await Promise.all([
      fetch(`/api/bots/${encodeURIComponent(name)}/state`),
      fetch(`/api/bots/${encodeURIComponent(name)}/scene`),
    ]);
    const payload = await res.json();
    const scene = await sceneRes.json().catch(() => ({}));
    paint(payload, sceneRes.ok ? scene : { error: scene.error || 'Map failed' });
    return payload;
  };
  let payload = null;
  openPanel(name, [
    mapAnchor(name, 'Map'),
    actionButton('Refresh', '', async () => { payload = await load(); }),
    actionButton('Copy', '', async () => {
      await navigator.clipboard.writeText(payload?.text || $('panel-body').innerText);
      showToast(name, 'State copied');
    }),
  ]);
  payload = await load();
}

async function openLog(name, which) {
  const kinds = [
    ['grind', 'Grind'],
    ['out', 'Out'],
    ['err', 'Err'],
    ['lite', 'Lite'],
    ['lite-err', 'Lite err'],
  ];
  const current = which || 'grind';
  const tools = kinds.map(([id, label]) => {
    const button = actionButton(label, id === current ? 'primary' : '', () => openLog(name, id));
    return button;
  });
  openPanel(`${name} log`, tools);
  const res = await fetch(`/api/bots/${encodeURIComponent(name)}/log?which=${current}&lines=180`);
  const body = await res.json();
  const text = !res.ok ? (body.error || 'Log failed') : body.missing ? 'No log file yet.' : (body.lines || []).join('\n');
  const pre = el('pre', { text });
  $('panel-body').replaceChildren(pre);
  pre.scrollTop = pre.scrollHeight;
}

function setTab(tab) {
  state.tab = tab;
  $('tab-fleet').setAttribute('aria-pressed', String(tab === 'fleet'));
  $('tab-stats').setAttribute('aria-pressed', String(tab === 'stats'));
  $('tab-quests').setAttribute('aria-pressed', String(tab === 'quests'));
  if (tab === 'quests') loadQuests();
  render();
}

// Theme: follow the system unless a choice was saved. Storage can be blocked; the page works without it.
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(theme) {
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
  $('theme').textContent = theme === 'light' ? 'Light' : theme === 'dark' ? 'Dark' : 'Auto';
}
let theme = 'auto';
try { theme = localStorage.getItem('fleet-desk-theme') || 'auto'; } catch { theme = 'auto'; }
applyTheme(theme);
$('theme').onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem('fleet-desk-theme', theme); } catch { /* not saved */ }
  applyTheme(theme);
};

$('tab-fleet').onclick = () => setTab('fleet');
$('tab-stats').onclick = () => setTab('stats');
$('tab-quests').onclick = () => setTab('quests');
$('q').addEventListener('input', render);
$('view').addEventListener('change', render);
$('kind').addEventListener('change', render);
$('refresh').onclick = () => { refreshNow(); };
$('panel-close').onclick = () => { $('panel').hidden = true; };
$('map-close').onclick = () => closeMap();
$('map-account').addEventListener('focus', () => $('map-account').select());
$('map-account').addEventListener('input', () => { mapHit = 0; renderMapHits(); });
$('map-account').addEventListener('keydown', (event) => {
  const hits = mapQueryHits();
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    mapHit = $('map-hits').hidden ? 0 : Math.min(mapHit + 1, Math.max(hits.length - 1, 0));
    renderMapHits();
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    mapHit = Math.max(mapHit - 1, 0);
    renderMapHits();
  } else if (event.key === 'Enter') {
    event.preventDefault();
    pickMapHit();
  } else if (event.key === 'Escape' && (!$('map-hits').hidden || $('map-account').value !== mapFollow)) {
    event.stopPropagation();
    $('map-account').value = mapFollow || '';
    hideMapHits();
  }
});
$('map-account').addEventListener('blur', () => {
  setTimeout(() => {
    if (document.activeElement === $('map-account')) return;
    if (mapFollow) $('map-account').value = mapFollow;
    hideMapHits();
  }, 0);
});
$('map-refresh').onclick = () => { if (mapFollow) loadMapCard(mapFollow).catch((err) => showToast(mapFollow, err.message, 'bad')); };
$('skill-pop').addEventListener('click', (event) => event.stopPropagation());
document.addEventListener('click', (event) => {
  $('skill-pop').hidden = true;
  if (!$('map-search').contains(event.target)) hideMapHits();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if (!$('map-modal').hidden) closeMap();
    $('panel').hidden = true;
    $('skill-pop').hidden = true;
  }
  if (event.key === '/' && document.activeElement === document.body) {
    event.preventDefault();
    $('q').focus();
  }
});

$('banks').onclick = () => { checkBanks(); };
loadFleet().catch((err) => {
  $('headline').textContent = 'Fleet desk could not load';
  $('sub').textContent = err.message;
});
fetch('/api/jobs').then((res) => res.json()).then((jobs) => {
  const bank = (jobs || []).find((job) => job.action === 'banks' && job.status === 'running');
  if (!bank) return;
  $('banks').disabled = true;
  track(bank).finally(() => { $('banks').disabled = false; });
}).catch(() => undefined);
// Host health strip: memory is what drops clients on the box, so it goes amber/red first.
async function loadBox() {
  const el = $('box');
  try {
    const b = await (await fetch('/api/box')).json();
    if (!b) { el.hidden = true; return; }
    const gb = (mb) => (mb / 1024).toFixed(1);
    const memCls = b.memAvailableMb < 800 ? 'bad' : b.memAvailableMb < 1500 ? 'warn' : '';
    const swapCls = b.swapUsedMb > 4096 ? 'bad' : b.swapUsedMb > 1024 ? 'warn' : '';
    const loadCls = b.load5 > b.cores * 1.5 ? 'bad' : b.load5 > b.cores ? 'warn' : '';
    const dropCls = b.clientDrops1h >= 10 ? 'bad' : b.clientDrops1h > 0 ? 'warn' : '';
    const bit = (cls, text, title = '') => {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      if (title) span.title = title;
      span.textContent = text;
      return span;
    };
    el.replaceChildren(
      bit(memCls, `mem ${gb(b.memAvailableMb)}/${gb(b.memTotalMb)} GB free`),
      bit(swapCls, `swap ${gb(b.swapUsedMb)} GB`),
      bit(loadCls, `load ${b.load1.toFixed(1)} / ${b.cores} cores`),
      bit('', `${b.containers ?? '?'} containers`),
      bit(dropCls, `${b.clientDrops1h} client drops 1h`, b.dropBots1h.join(', ')),
    );
    el.hidden = false;
  } catch {
    el.hidden = true;
  }
}
loadBox();
setInterval(() => {
  if (document.hidden || refreshing) return;
  loadBox();
  loadFleet().catch(() => undefined);
  if (state.tab === 'quests') loadQuests();
}, 20000);
